<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Short addresses for a client's editor: /<site> goes to the admin page's
         sign-in for that site, which opens the site with its editor on. Before
         anything else loads, so there is no flash of this site first. -->
    <script>
      (function () {
        var sites = { '/storyshaped': 'storyshaped' }
        var site = sites[location.pathname.replace(/\/+$/, '').toLowerCase()]
        if (site) location.replace('https://admin.theedgeofthemap.com/?handoff=' + site + '&return=%2F')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edge of the Map — Narration, Software &amp; Woodwork</title>
    <meta
      name="description"
      content="Edge of the Map LLC: audiobook narration, full-stack web development, and commissioned woodworking. One practitioner, three trades, work made to last."
    />
    <link rel="canonical" href="https://theedgeofthemap.com/" />
    <!-- The two heads from src/assets/logo.png, cropped square: the wordmark is illegible at icon size. -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f766e" />

    <!-- The header plate is the LCP element, and the page is client-rendered:
         without this the request cannot start until the JS has parsed, because
         the preload scanner never sees the <img>. Nameable here only because
         the file is in public/ and so has a stable, unhashed URL. -->
    <link rel="preload" as="image" href="/banner.webp" fetchpriority="high" />

    <!-- Social card. Absolute URLs are required — crawlers do not resolve
         relative paths. Served from public/ so the URL stays stable across
         builds; bundled assets are content-hashed and would break each time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edge of the Map LLC" />
    <meta property="og:url" content="https://theedgeofthemap.com/" />
    <meta
      property="og:title"
      content="Edge of the Map — Narration, Software &amp; Woodwork"
    />
    <meta
      property="og:description"
      content="One practitioner, three trades: audiobook narration, full-stack development, and commissioned woodworking."
    />
    <meta property="og:image" content="https://theedgeofthemap.com/og.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Edge of the Map console: visitors get only this small loader; ?edit opens
         the editor for a signed-in owner (console README, "Putting a site on it"). -->
    <script src="https://admin.theedgeofthemap.com/loader.js" data-site="edgeofthemap" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
